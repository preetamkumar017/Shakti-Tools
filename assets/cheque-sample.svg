<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 356" width="100%" height="100%">
  <defs>
    <!-- Security Background Pattern -->
    <pattern id="guilloche" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 5 0, 10 10 T 20 10" fill="none" stroke="#e0e7ef" stroke-width="0.7" opacity="0.6"/>
      <path d="M 0 10 Q 5 20, 10 10 T 20 10" fill="none" stroke="#d5e0ee" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="50%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#edf2f8"/>
    </linearGradient>
    <filter id="subtleShadow" x="-1%" y="-1%" width="102%" height="102%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Cheque Body -->
  <rect x="0" y="0" width="812" height="356" rx="6" fill="url(#bgGradient)" stroke="#c2d0e0" stroke-width="1.5" />
  <rect x="0" y="0" width="812" height="356" fill="url(#guilloche)" rx="6"/>

  <!-- Top Border Accent / Bank Branding Area -->
  <rect x="16" y="14" width="200" height="36" rx="4" fill="#ffffff" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="26" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#1e293b" letter-spacing="0.5">STANDARD CTS-2010</text>
  <text x="26" y="44" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#64748b">VALID FOR 3 MONTHS ONLY</text>

  <!-- CTS-2010 Watermark / Logo -->
  <g transform="translate(16, 140)">
    <rect x="0" y="0" width="16" height="50" fill="#0284c7" opacity="0.1" rx="2"/>
    <text x="-35" y="11" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#64748b" transform="rotate(-90)" letter-spacing="2">CTS-2010</text>
  </g>

  <!-- Date Section with 8 Boxes -->
  <g transform="translate(604, 32)">
    <text x="0" y="-10" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">DATE</text>
    
    <!-- D D M M Y Y Y Y Box Headers -->
    <text x="6" y="38" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">D</text>
    <text x="27" y="38" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">D</text>
    <text x="49" y="38" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">M</text>
    <text x="70" y="38" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">M</text>
    <text x="91" y="38" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">Y</text>
    <text x="113" y="38" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">Y</text>
    <text x="134" y="38" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">Y</text>
    <text x="156" y="38" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">Y</text>

    <!-- 8 Individual Boxes -->
    <rect x="0" y="0" width="18" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2" rx="1.5"/>
    <rect x="21" y="0" width="18" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2" rx="1.5"/>
    <rect x="43" y="0" width="18" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2" rx="1.5"/>
    <rect x="64" y="0" width="18" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2" rx="1.5"/>
    <rect x="85" y="0" width="18" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2" rx="1.5"/>
    <rect x="107" y="0" width="18" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2" rx="1.5"/>
    <rect x="128" y="0" width="18" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2" rx="1.5"/>
    <rect x="150" y="0" width="18" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2" rx="1.5"/>
  </g>

  <!-- PAY Section -->
  <text x="60" y="104" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#334155" letter-spacing="1">PAY</text>
  <line x1="95" y1="106" x2="720" y2="106" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="730" y="104" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748b">OR BEARER</text>

  <!-- RUPEES Section -->
  <text x="60" y="142" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#334155" letter-spacing="1">RUPEES</text>
  <line x1="120" y1="144" x2="570" y2="144" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="60" y1="178" x2="570" y2="178" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 3"/>

  <!-- Amount in Figures Box -->
  <g transform="translate(590, 134)">
    <rect x="0" y="0" width="180" height="46" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="3" y="3" width="34" height="40" fill="#f1f5f9" rx="2"/>
    <text x="14" y="29" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#0f172a">₹</text>
    <line x1="38" y1="3" x2="38" y2="43" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Account Details & Signatory Area -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="220" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="10" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#475569">A/C NO.  00123456789012</text>
  </g>

  <g transform="translate(560, 220)">
    <text x="50" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Please sign above this line</text>
    <line x1="0" y1="24" x2="210" y2="24" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Bottom MICR Band (Standard CTS-2010 White Band) -->
  <rect x="0" y="285" width="812" height="71" fill="#ffffff" stroke-top="#cbd5e1" stroke-width="1"/>
  <text x="180" y="326" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#334155" letter-spacing="4">⑈123456⑈  110002001⑆  000123⑈  10</text>
</svg>
